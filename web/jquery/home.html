<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Jquery basic</h1>

    <button id="showText">Show content</button>
    <p id="text"></p>



    <!-- js -->
    <script src="../assets/js/jquery-3.7.7.min.js"></script>
    <script>
        $(document).ready(function (){
            $("#showText").on("click", function (){
                let text = "Sample <br> <strong> jquery </strong> text";
                // $("#text").text(text);
                console.log(text);
                $("#text").html(text);
            })
        });
    </script>
</body>
</html>
