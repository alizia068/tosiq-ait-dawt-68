<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            900: '#121212',
                            800: '#1e1e1e',
                            700: '#2d2d2d',
                        },
                        accent: {
                            blue: '#3b82f6',
                            green: '#10b981',
                            red: '#ef4444',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-dark-900 text-white min-h-screen font-sans antialiased">
    <div class="container mx-auto px-4 py-8">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div class="text-center md:text-left">
                <h1
                    class="text-3xl font-bold tracking-tight bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                    Crypto Live</h1>
                <p class="text-gray-400 text-sm mt-1">Real-time market updates</p>
            </div>

            <div class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
                <div class="relative w-full md:w-64">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="text" id="search-input"
                        class="bg-dark-800 border border-dark-700 text-white text-sm rounded-full focus:ring-accent-blue focus:border-accent-blue block w-full pl-10 p-2.5 transition-colors placeholder-gray-500"
                        placeholder="Search coins...">
                </div>

                <div id="connection-status"
                    class="flex items-center space-x-2 bg-dark-800 px-3 py-1.5 rounded-full border border-dark-700 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse" id="status-dot"></span>
                    <span class="text-xs font-medium text-gray-300" id="status-text">Disconnected</span>
                </div>
            </div>
        </header>

        <div id="crypto-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards will be injected here -->
            <div class="col-span-full text-center py-20">
                <div class="inline-blockanimate-pulse">Loading market data...</div>
            </div>
        </div>

        <footer class="mt-12 text-center text-gray-500 text-xs pb-8">
            <p>Data provided by CoinGecko API via Socket.io</p>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
